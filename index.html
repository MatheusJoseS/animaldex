<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnimalDex – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="decor decor-stripes" aria-hidden="true"></div>
  <div class="decor decor-dots" aria-hidden="true"></div>

  <main class="login">
    <section class="hero" aria-hidden="false">
      <div class="hero-ring"></div>
      <!-- Coloque aqui a imagem do cachorro e do gato (PNG com fundo transparente) -->
      <img class="hero-img" src="img/pets.png" alt="Um cachorro golden retriever e um gatinho correndo felizes">
    </section>

    <section class="panel">
      <div class="card">
        <h1 class="logo">Animal<span>Dex</span></h1>

        <form class="form" action="inicio.html" method="post">
          <label class="sr-only" for="email">E-mail</label>
          <input class="field" type="email" id="email" name="email" placeholder="E mail" autocomplete="email" required>

          <label class="sr-only" for="senha">Senha</label>
          <input class="field" type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" required>

          <button class="btn btn-primary" type="submit">Entrar</button>
        </form>

        <div class="divider"><span>OU</span></div>

        <a class="btn btn-google" href="inicio.html">
          <svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.2 7-10.3 7-17.6z"/>
            <path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3.1-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/>
            <path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.600-5.900c-2.100 1.400-4.900 2.300-8.300 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/>
          </svg>
          <span>Entrar com o Google</span>
        </a>

        <a class="forgot" href="#">Esqueceu a senha?</a>
      </div>

      <a class="btn btn-create" href="inicio.html">Criar Conta</a>
    </section>
  </main>
</body>
</html>
